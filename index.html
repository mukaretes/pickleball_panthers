<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#52a832"><title>Pickleball Panthers</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pickleball Panthers"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>

;border-radius:14px;padding:8px;background:#f8fafc}.playerBox.male input{background:var(--ff);border-color:#38bdf8}.playerBox.female input{background:var(--nn);border-color:#f472b6}.genderToggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}.genderBtn{border:1px solid var(--line);border-radius:999px;background:#fff;color:#334155;font-size:11px;font-weight:900;padding:5px 4px;line-height:1.05}.genderBtn.male.active{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}.genderBtn.female.active{background:#fce7f3;border-color:#ec4899;color:#be185d}.hint{background:var(--gold);border-radius:12px;padding:10px;margin-top:10px}.match{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;margin:10px 0}.mh{display:flex;justify-content:space-between;margin-bottom:8px;gap:8px}.pill{border-radius:999px;background:#e4f8dc;color:#245a13;font-size:12px;font-weight:900;padding:5px 8px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center}.team{border:1px solid var(--line);border-radius:14px;padding:10px;min-height:74px}.team.ff{background:var(--ff);border-color:#38bdf8}.team.mix{background:var(--mix);border-color:#86efac}.team.nn{background:var(--nn);border-color:#f472b6}.teamType{font-size:11px;border-radius:999px;padding:4px 7px;margin-left:5px;font-weight:900}.team.ff .teamType{background:#bae6fd;color:#075985}.team.mix .teamType{background:#dcfce7;color:#166534}.team.nn .teamType{background:#fbcfe8;color:#9d174d}.vs{font-weight:900;color:#94a3b8}.score{margin-top:10px}.score input{text-align:center;font-size:22px;font-weight:900;background:var(--blue)}.inputHint{font-size:11px;color:var(--muted);margin-top:4px}.ok{color:#16a34a;font-weight:900}.bad{color:#dc2626;font-weight:900}.win{font-size:12px;font-weight:800;margin-top:7px;color:#334155}.hc{font-size:12px;color:#245a13;background:#e4f8dc;border-radius:12px;padding:7px 8px;margin-top:7px;font-weight:750}.bye{margin-top:8px;background:var(--gold);border-radius:12px;padding:8px;font-size:13px}.cup{display:none}.cup.visible{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:7px;border-radius:50%;font-size:17px;background:linear-gradient(135deg,#fff7ad,#ffd700 52%,#f59e0b);box-shadow:0 0 12px rgba(255,215,0,.72),0 3px 7px rgba(0,0,0,.26)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--green);color:#fff}tr:nth-child(even) td{background:#f8fafc}.rank1 td{background:linear-gradient(90deg,rgba(255,215,0,.25),rgba(255,215,0,.06))!important;font-weight:900}.rank2 td{background:linear-gradient(90deg,rgba(192,192,192,.25),rgba(192,192,192,.06))!important;font-weight:850}.rank3 td{background:linear-gradient(90deg,rgba(205,127,50,.23),rgba(205,127,50,.06))!important;font-weight:800}.medal{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;margin-left:7px;border-radius:50%;font-size:16px;vertical-align:-6px}.gold{background:linear-gradient(135deg,#fff3a3,#ffd700 55%,#f59e0b)}.silver{background:linear-gradient(135deg,#f8fafc,#cbd5e1 55%,#94a3b8)}.bronze{background:linear-gradient(135deg,#f4b879,#cd7f32 55%,#92400e);color:#fff}.toast{position:fixed;left:12px;right:12px;bottom:12px;background:#0f172a;color:#fff;padding:12px;border-radius:14px;text-align:center;z-index:30}@media(min-width:720px){.players{grid-template-columns:repeat(4,1fr)}.matchList{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match{margin:0}}

(function(){'use strict';var KEY='pickleball-panthers-pwa-v1',TOTAL=21,state={players:[],genders:[],schedule:[],scores:{},playerCount:8,roundCount:12,rankMode:'sports',handicapEnabled:true,handicapUnit:2};function el(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function toast(m){var t=el('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add('hidden')},1500)}function defaults(n){var a=[];for(var i=1;i<=n;i++)a.push('Játékos '+i);return a}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function normalize(){state.playerCount=Math.min(16,Math.max(4,+state.playerCount||8));state.roundCount=Math.min(24,Math.max(1,+state.roundCount||12));if(!Array.isArray(state.players)||state.players.length!==state.playerCount)state.players=defaults(state.playerCount).map(function(d,i){return (state.players||[])[i]||d});if(!Array.isArray(state.genders))state.genders=[];for(var i=0;i<state.playerCount;i++)if(!state.genders[i])state.genders[i]='M';state.genders=state.genders.slice(0,state.playerCount);if(!Array.isArray(state.schedule))state.schedule=[];if(!state.scores||typeof state.scores!=='object')state.scores={};state.rankMode=state.rankMode||'sports';state.handicapEnabled=state.handicapEnabled!==false;state.handicapUnit=+state.handicapUnit||2}function load(){try{var raw=localStorage.getItem(KEY);if(raw)Object.assign(state,JSON.parse(raw))}catch(e){}normalize()}function show(name){['setup','matches','rank'].forEach(function(x){el(x).classList.toggle('hidden',x!==name)});['Setup','Matches','Rank'].forEach(function(x){el('tab'+x).classList.remove('active')});el('tab'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('active');if(name==='matches')renderMatches();if(name==='rank')renderRank();setTimeout(function(){scrollTo(0,0)},0)}function genderOf(i){return state.genders[i]||'M'}function pname(i){return state.players[i]||('Játékos '+(i+1))}function pairKey(a,b){return a<b?a+'-'+b:b+'-'+a}function teamLabel(t){var f=(genderOf(t[0])==='F'?1:0)+(genderOf(t[1])==='F'?1:0);return f===0?'FF':f===1?'Vegyes':'NN'}function teamClass(t){var l=teamLabel(t);return l==='FF'?'ff':l==='NN'?'nn':'mix'}function teamStrength(t){var f=(genderOf(t[0])==='F'?1:0)+(genderOf(t[1])==='F'?1:0);return f===0?2:f===1?1:0}
