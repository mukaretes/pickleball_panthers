ding:10px;margin-top:10px}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.playerBox{border:1px solid var(--line);border-radius:14px;padding:8px;background:#f8fafc}.playerBox.male input{background:var(--ff);border-color:#38bdf8}.playerBox.female input{background:var(--nn);border-color:#f472b6}.genderToggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}.genderBtn{border:1px solid var(--line);border-radius:999px;background:#fff;color:#334155;font-size:11px;font-weight:900;padding:5px 4px}.genderBtn.male.active{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}.genderBtn.female.active{background:#fce7f3;border-color:#ec4899;color:#be185d}.roundBlock{border:1px solid #d8ead0;border-radius:18px;margin:12px 0;background:#fff;box-shadow:var(--shadow);overflow:hidden}.roundHead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;color:#0f172a;border-radius:0;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}.roundHead.open{background:#e4f8dc}.roundTitle{font-weight:900}.roundMeta{font-size:12px;color:#475569;font-weight:800}.progressWrap{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:7px}.progressBar{height:100%;background:linear-gradient(90deg,#52a832,#8bd85a);width:0%}.roundBody{padding:10px}.roundBody.collapsed{display:none}.match{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;margin:10px 0}.match.activeMatch{border-color:#52a832;box-shadow:0 0 0 3px rgba(82,168,50,.14)}.mh{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;align-items:center}.pill{border-radius:999px;background:#e4f8dc;color:#245a13;font-size:12px;font-weight:900;padding:5px 8px}.statusDone{font-size:12px;font-weight:900;color:#16a34a}.statusTodo{font-size:12px;font-weight:900;color:#64748b}.teams{display:grid;grid-template-columns:1fr 36px 1fr;gap:7px;align-items:stretch}.team{border:1px solid var(--line);border-radius:14p tr:nth-child(even) td{background:#f8fafc}.rank1 td{background:linear-gradient(90deg,rgba(255,215,0,.25),rgba(255,215,0,.06))!important;font-weight:900}.rank2 td{background:linear-gradient(90deg,rgba(192,192,192,.25),rgba(192,192,192,.06))!important;font-weight:850}.rank3 td{background:linear-gradient(90deg,rgba(205,127,50,.23),rgba(205,127,50,.06))!important;font-weight:800}.medal{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;margin-left:7px;border-radius:50%;font-size:16px;vertical-align:-6px}.gold{background:linear-gradient(135deg,#fff3a3,#ffd700 55%,#f59e0b)}.silver{background:linear-gradient(135deg,#f8fafc,#cbd5e1 55%,#94a3b8)}.bronze{background:linear-gradient(135deg,#f4b879,#cd7f32 55%,#92400e);color:#fff}.floatingNext{position:fixed;left:14px;right:14px;bottom:14px;z-index:30;display:none;box-shadow:0 8px 22px rgba(15,23,42,.22)}.floatingNext.show{display:block}.toast{position:fixed;left:12px;right:12px;bottom:72px;background:#0f172a;color:white;padding:12px;border-radius:14px;text-align:center;z-index:35}@media(max-width:420px){.teams{grid-template-columns:1fr 28px 1fr;gap:5px}.team{padding:8px;min-height:86px}.teamHeader{font-size:12px;gap:4px}.teamType{font-size:10px;padding:3px 6px}.playerLine{font-size:13px}.vs{font-size:11px}.score input{font-size:27px;height:56px}}@media(min-width:720px){.players{grid-template-columns:repeat(4,1fr)}.roundBody{display:grid;grid-template-columns:1fr 1fr;gap:10px}.roundBody.collapsed{display:none}.match{margin:0}}

function el(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]})}function toast(m){var t=el('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add('hidden')},1500)}function defaults(n){var a=[];for(var i=1;i<=n;i++)a.push('Játékos '+i);return a}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function normalize(){state.playerCount=Math.min(16,Math.max(4,+state.playerCount||8));state.roundCount=Math.min(24,Math.max(1,+state.roundCount||12));if(!Array.isArray(state.players)||state.players.length!==state.playerCount)state.players=defaults(state.playerCount).map(function(d,i){return (state.players||[])[i]||d});if(!Array.isArray(state.genders))state.genders=[];for(var i=0;i<state.playerCount;i++)if(!state.genders[i])state.genders[i]='M';state.genders=state.genders.slice(0,state.playerCount);if(!Array.isArray(state.schedule))state.schedule=[];if(!state.scores||typeof state.scores!=='object')state.scores={};if(['score20','score10','stats'].indexOf(state.rankMode)<0)state.rankMode='score20';state.statsSort=state.statsSort||'wins';state.handicapEnabled=state.handicapEnabled!==false;state.handicapUnit=+state.handicapUnit||2;state.openRound=+state.openRound||1}function load(){try{var raw=localStorage.getItem(KEY);if(raw)Object.assign(state,JSON.parse(raw))}catch(e){}normalize()}
function show(name){['setup','matches','rank'].forEach(function(x){el(x).classList.toggle('hidden',x!==name)});['Setup','Matches','Rank'].forEach(function(x){el('tab'+x).classList.remove('active')});el('tab'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('active');if(name==='matches')renderMatches();if(name==='rank')renderRank();setTimeout(function(){scrollTo(0,0)},0)}function genderOf(i){return state.genders[i]||'M'}function pname(i){return state.players[i]||('Játékos '+(i+1))}function teamLabel(t){var f=(genderOf(t[0])==='F'?1:0)+(genderOf(t[1])==='F'?1:0);return f===0?'FF':f===1?'Mix':'NN'}function teamClass(t){var l=teamLabel(t);return l==='FF'?'ff':l==='NN'?'nn':'mix'}function teamStrength(t){var f=(genderOf(t[0])==='F'?1:0)+(genderOf(t[1])==='F'?1:0);return f===0?2:f===1?1:0}function winMultiplier(){return state.rankMode==='score10'?10:20}function diffText(v){return v>0?'+'+v:String(v)}function pairKey(a,b){return a<b?a+'-'+b:b+'-'+a}function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function initControls(){for(var i=4;i<=16;i++)el('playerCount').innerHTML+='<option value="'+i+'">'+i+'</option>';for(var r=1;r<=24;r++)el('roundCount').innerHTML+='<option value="'+r+'">'+r+'</option>';el('playerCount').value=state.playerCount;el('roundCount').value=state.roundCount;el('rankMode').value=state.rankMode;el('statsSort').value=state.statsSort;el('handicapEnabled').checked=!!state.handicapEnabled;el('handicapUnit').value=String(state.handicapUnit);updateStatsSortVisibility()}function updateStatsSortVisibility(){el('statsSortWrap').classList.toggle('hidden',state.rankMode!=='stats')}
function renderPlayers(){var html='';for(var i=0;i<state.playerCount;i++){var cls=genderOf(i)==='F'?'female':'male';html+='<div class="playerBox '+cls+'" data-playerbox="'+i+'"><label>#'+(i+1)+'</label><input data-player="'+i+'" value="'+esc(pname(i))+'"><div class="genderToggle"><button type="button" class="genderBtn male '+(genderOf(i)==='M'?'active':'')+'" data-gender-btn="'+i+'" data-gender-value="M">Férfi</button><button type="button" class="genderBtn female '+(genderOf(i)==='F'?'active':'')+'" data-gender-btn="'+i+'" data-gender-value="F">Nő</button></div></div>'}el('players').innerHTML=html;document.querySelectorAll('[data-player]').forEach(function(inp){inp.oninput=function(){state.players[+this.dataset.player]=this.value;save();updateNames();renderRank()}});document.querySelectorAll('[data-gender-btn]').forEach(function(btn){btn.onclick=function(){var i=+this.dataset.genderBtn,val=this.dataset.genderValue;state.genders[i]=val;var box=document.querySelector('[data-playerbox="'+i+'"]');if(box){box.classList.toggle('female',val==='F');box.classList.toggle('male',val!=='F')}document.querySelectorAll('[data-gender-btn="'+i+'"]').forEach(function(b){b.classList.toggle('active',b.dataset.genderValue===val)});save();renderMatches();renderRank()}})}function updateNames(){state.schedule.forEach(function(m,i){var c=document.querySelector('[data-match="'+i+'"]');if(!c)return;c.querySelector('[data-n="a0"]').textContent=pname(m.a[0]);c.querySelector('[data-n="a1"]').textContent=pname(m.a[1]);c.querySelector('[data-n="b0"]').textContent=pname(m.b[0]);c.querySelector('[data-n="b1"]').textContent=pname(m.b[1])})}

function makeSchedule(n,rds){var players=[];for(var i=0;i<n;i++)players.push(i);var rows=[],courts=Math.floor(n/4),activeN=courts*4,pc={},plays=Array(n).fill(0),byes=Array(n).fill(0);for(var a=0;a<n;a++)for(var b=a+1;b<n;b++)pc[pairKey(a,b)]=0;for(var r=1;r<=rds;r++){var need=n-activeN,bye=[];if(need>0)bye=players.slice().sort(function(a,b){return (byes[a]-byes[b])-(plays[a]-plays[b])*0.2+Math.random()-.5}).slice(0,need);var active=players.filter(function(p){return bye.indexOf(p)<0}),teams=[];while(active.length){var p=active.shift(),best=0,cost=Infinity;for(var j=0;j<active.length;j++){var q=active[j],c=(pc[pairKey(p,q)]||0)*1000+Math.abs(plays[p]-plays[q]);if(c<cost){cost=c;best=j}}var q=active.splice(best,1)[0];teams.push([p,q]);pc[pairKey(p,q)]++}shuffle(teams);for(var k=0;k<teams.length;k+=2){rows.push({round:r,court:k/2+1,a:teams[k],b:teams[k+1],bye:k===0?bye.slice():[]});teams[k].concat(teams[k+1]).forEach(function(p){plays[p]++})}bye.forEach(function(p){byes[p]++})}return rows}
